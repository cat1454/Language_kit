services:
  db:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54320}:5432"
    environment:
      POSTGRES_USER: language_kit
      POSTGRES_PASSWORD: language_kit
      POSTGRES_DB: language_kit_dev
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U language_kit -d language_kit_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://language_kit:language_kit@db:5432/language_kit_dev
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    command: pnpm dev

volumes:
  pgdata:
